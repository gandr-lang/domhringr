#:tombi toml-version = "v1.0.0"
# One toolchain for the whole workspace. A Dylint library and its driver link
# rustc's internal libraries, whether the library is built locally or loaded
# from Git. Stable-facing crates use this compiler too; a stable release build
# remains the check that no nightly-only implementation leaked into them.
# Producers move the nightly and local clippy_utils tag together with
# `mise run toolchain:bump <stable>`. Git-library consumers take the compiler
# and metadata revision together with `toolchain:bump --workflow-rev <commit>`.
# rust-clippy's rust-<stable> release tag names, in its own rust-toolchain.toml,
# the nightly that tagged clippy_utils was built against. The task writes both
# pins from that one file and prints the driver-rebuild command a bump owes.

# Factory consumes the policy at its reviewed Git revision.
[toolchain]
channel = "nightly-2026-06-25"
# `rust-src`: `cargo build-dist` rebuilds std (`.cargo/config.dist.toml`).
components = ["rustc-dev", "llvm-tools", "clippy", "rustfmt", "rust-src"]
profile = "minimal"
