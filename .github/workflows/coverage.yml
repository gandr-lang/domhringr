# <critical>
# MUST preserve anchor-first CI: maximal sharing, no copied orchestration.
# New functionality MUST reuse template anchors or add anchors for likely reuse.
# MUST parameterize differences; performance exceptions require measured evidence.
# Share exceptional logic through actions; preserve parallelism, caches, and gates.
# </critical>
# Lists we produce are displayed collapsed: in `<details>` under a one-line
# summary of what, how many and the verdict.
name: Coverage

# Daily on main when main moved since the last upload, never per landing: an
# instrumented run pays a cold instrumented build and two to three times the
# test time, and a run per push was cancelled by the next push before it
# uploaded. A pull request that wants numbers dispatches this workflow, which
# always measures, or runs `mise run check:coverage`.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# One run at a time; a dispatch during the scheduled run replaces it.
concurrency:
  group: coverage-main
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
  MISE_CARGO_BINSTALL_QUICKINSTALL: "true"
  MISE_CARGO_BINSTALL_NATIVE: "true"
  # Must match ci.yml and the image. The image checks the list at build time.
  MISE_DISABLE_TOOLS: "github:orhun/git-cliff,github:max-sixty/worktrunk,github:j178/prek,github:nektos/act"
  # Empty selects the bare runner. A set value selects the pin-file tag,
  # and only a published tag is used: this workflow does not publish.
  DOMHRINGR_CI_IMAGE: ${{ vars.DOMHRINGR_CI_IMAGE }}
  CI_IMAGE_NAME: ghcr.io/gandr-lang/domhringr-ci

jobs:
  # Definitions only: aliases run in each consuming job's context.
  template:
    if: false
    runs-on: &linux ubuntu-24.04-arm
    permissions: &image-read-permissions
      contents: read
      packages: read
    steps:
      - &git-checkout
        name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - &trust-workspace
        name: trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The value plane is a path dependency into vendor/gandr. act
      # materialises the sibling in its clone and copies it with the tree.
      - &read-sibling-pins
        id: siblings
        name: read the sibling pins
        if: ${{ !env.ACT }}
        shell: bash
        run: |
          gandr=$(sed -n '/^\[workspace\.metadata\.siblings\]$/,/^\[/s/^gandr = "\([0-9a-f]*\)"$/\1/p' Cargo.toml)
          test -n "$gandr"
          echo "gandr=$gandr" >> "$GITHUB_OUTPUT"
      - &checkout-gandr
        name: check out the gandr sibling
        if: ${{ !env.ACT }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gandr-lang/gandr
          ref: ${{ steps.siblings.outputs.gandr }}
          path: vendor/gandr
          persist-credentials: false
      - &pin-tag
        id: pin_tag
        name: compute the pin-file image tag
        if: ${{ env.DOMHRINGR_CI_IMAGE != '' }}
        shell: bash
        run: .github/docker/image-tag.sh >> "$GITHUB_OUTPUT"
      - &registry-login
        name: log in to GHCR
        if: ${{ steps.pin_tag.outputs.tag != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The ci.yml lookup, parameterized by CI_IMAGE_NAME. A missing tag
      # selects the bare runner; this workflow does not build the image.
      - &lookup-image
        id: lookup
        name: look up the published image
        if: ${{ steps.pin_tag.outputs.tag != '' }}
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.pin_tag.outputs.tag }}
        run: |
          if error=$(docker manifest inspect "${CI_IMAGE_NAME}:${IMAGE_TAG}" 2>&1 > /dev/null); then
            echo found=true >> "$GITHUB_OUTPUT"
          elif [[ $error == *"manifest unknown"* ]]; then
            echo found=false >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$error" >&2
            exit 1
          fi
      - &setup-rust
        name: setup rust
        uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          install-toolchain: ${{ needs.ci-image-ref.outputs.ref == '' }}
          cache-save: false
      - &install-policy-tools
        name: install mise-managed policy tools
        if: ${{ needs.ci-image-ref.outputs.ref == '' }}
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.3
          cache: true
          cache_key: mise-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'rust-toolchain.toml') }}
          cache_save: false
      # The instrumented build lives in its own target directory and nothing
      # else writes it, so this job is its one cache writer. The key is the
      # dependency fingerprint: the dependencies' instrumented artifacts are
      # what a run reuses (cargo-llvm-cov rebuilds the workspace's own crates
      # so coverage data is never stale), so one entry per fingerprint is
      # exact, and a partial match restores the newest entry to rebuild from.
      - &identify-coverage-state
        name: identify coverage-state inputs
        env:
          CI_STATE_FINGERPRINT: ${{ hashFiles('**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
        run: printf 'COVERAGE_STATE_FINGERPRINT=%s\n' "$CI_STATE_FINGERPRINT" >> "$GITHUB_ENV"
      - &restore-coverage-state
        name: restore instrumented build state
        id: coverage-state-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/coverage
          key: domhringr-v1-coverage-state-${{ runner.os }}-${{ runner.arch }}-${{ env.COVERAGE_STATE_FINGERPRINT }}
          restore-keys: domhringr-v1-coverage-state-${{ runner.os }}-${{ runner.arch }}-
      - &measure-coverage
        name: measure enforcing coverage
        run: mise run check:coverage
      - &save-coverage-state
        name: cache instrumented build state
        if: ${{ !cancelled() && steps.coverage-state-restore.outputs.cache-hit != 'true' && hashFiles('target/coverage/**/.rustc_info.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/coverage
          key: ${{ steps.coverage-state-restore.outputs.cache-primary-key }}
      - &upload-coverage
        name: upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov
          flags: enforcing
          fail_ci_if_error: true
          disable_search: true

  ci-image-ref:
    name: resolve the CI image reference
    runs-on: *linux
    permissions: *image-read-permissions
    outputs:
      ref: ${{ steps.lookup.outputs.found == 'true' && format('ghcr.io/gandr-lang/domhringr-ci:{0}', steps.pin_tag.outputs.tag) || '' }}
    steps:
      - *git-checkout
      - *pin-tag
      - *registry-login
      - *lookup-image

  # The scheduled run measures only when main moved since the last successful
  # upload; a dispatch always measures. A run that skipped the measurement
  # succeeds at the same commit the last upload covered, so the comparison
  # stays exact across skips, and a failed measurement is retried next day.
  freshness:
    name: decide whether main moved since the last upload
    runs-on: *linux
    permissions:
      actions: read
    outputs:
      stale: ${{ steps.compare.outputs.stale }}
    steps:
      - id: compare
        name: compare main against the last successful upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          uploaded=$(gh run list --workflow coverage.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$uploaded" = "$GITHUB_SHA" ]; then
            echo "main is at $GITHUB_SHA, the commit the last successful upload covered: nothing to measure"
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $GITHUB_SHA, the last successful upload covered ${uploaded:-nothing}: measuring"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

  coverage:
    name: measure and upload coverage
    needs: [ci-image-ref, freshness]
    if: ${{ !cancelled() && !failure() && (github.event_name == 'workflow_dispatch' || needs.freshness.outputs.stale == 'true') }}
    # The measuring run stays on x86-64, as gandr's does.
    runs-on: ubuntu-latest
    permissions: *image-read-permissions
    container: ${{ needs.ci-image-ref.outputs.ref }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 45
    steps:
      - *git-checkout
      - *trust-workspace
      - *install-policy-tools
      - *read-sibling-pins
      - *checkout-gandr
      - *setup-rust
      - *identify-coverage-state
      - *restore-coverage-state
      - *measure-coverage
      - *save-coverage-state
      - *upload-coverage
