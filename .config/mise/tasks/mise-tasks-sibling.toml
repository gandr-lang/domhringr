#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

# The value plane is a path dependency into vendor/gandr, gitignored and
# excluded from the workspace, so every gate that copies the tree copies the
# sibling with it. Cargo.lock records the sibling's own dependencies, so a
# sibling at any other revision than the one CI builds rewrites the lockfile
# and fails every --locked gate. By default vendor/gandr is therefore a clone
# at the revision [workspace.metadata.siblings] pins, made from the gandr
# checkout beside the main checkout (a linked worktree resolves its main
# checkout through Git) and moved whenever the pin moves; a clone with local
# changes is never moved. --link links that checkout instead, whatever
# revision it stands at, for changing both repositories together: a change
# built that way moves the pin in the same commit.
["sibling:sync"]
description = "Materialise vendor/gandr at the pin in [workspace.metadata.siblings]"
usage = '''
flag "--link" help="link the gandr checkout beside this one rather than clone it at the pin"
arg "[tree]" help="the checkout whose vendor/ receives the sibling; this one by default"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
tree=${usage_tree:-{{config_root}}}
rev=$(sed -n '/^\[workspace\.metadata\.siblings\]$/,/^\[/s/^gandr = "\([0-9a-f]*\)"$/\1/p' "$tree/Cargo.toml")
test -n "$rev"
common=$(git -C "{{config_root}}" rev-parse --path-format=absolute --git-common-dir)
source="$(dirname "$(dirname "$common")")/gandr"
target="$tree/vendor/gandr"
mkdir -p "$tree/vendor"
if [[ ${usage_link:-false} == true ]]; then
  if [[ -e $target && ! -L $target ]]; then
    echo "sibling:sync: $target is a clone; remove it to link the checkout instead" >&2
    exit 1
  fi
  rm -f "$target"
  ln -s "$source" "$target"
  exit 0
fi
if [[ -L $target ]]; then
  rm "$target"
fi
if [[ ! -e $target ]]; then
  git clone --quiet --local --no-hardlinks -- "$source" "$target"
elif [[ $(git -C "$target" rev-parse HEAD) == "$rev" ]]; then
  exit 0
elif [[ -n $(git -C "$target" status --porcelain) ]]; then
  echo "sibling:sync: $target has local changes; commit or discard them to move it to $rev" >&2
  exit 1
fi
git -C "$target" cat-file -e "$rev^{commit}" 2>/dev/null || git -C "$target" fetch --quiet origin "$rev"
git -C "$target" checkout --quiet --detach "$rev"
'''
