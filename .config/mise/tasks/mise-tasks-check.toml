#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

# The wall. Every `check:*` task is one gate; `check` fans out to all of them.
# A gate enters this file when a weed appears that it would have caught, with
# the reason beside it, and never pre-emptively.

[check]
description = "Every gate"
depends = ["check:*"]

["check:fmt"]
description = "rustfmt, unchanged"
run = "cargo fmt --all --check"

["check:clippy"]
description = "The clippy half of the lint wall"
run = "cargo clippy --workspace --all-targets --locked -- --deny warnings"

# Runtime sentinels exist only with enforcement enabled. Match the enforcing
# test build's profile, flags and artifact directory so CI can reuse it.
["check:clippy-enforcing"]
description = "The clippy wall with specification enforcement"
env.RUSTFLAGS = "--cfg anodized_panic"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/enforcing"
run = "cargo clippy --workspace --all-targets --locked --profile test -- --deny warnings"

# The compiler-plugin half of the lint wall, from the pinned Git policy
# source: specification presence, adequacy grammar, nominal signature
# boundaries, absence signatures, primitive arithmetic, transparent layout,
# recursion and ownership cycles. `option_signature` and
# `primitive_arithmetic` are opt-in upstream and selected by `cfg_attr` on
# each crate root (`lib.rs`, the two binaries, the integration test); the
# absence predicate recognizes `Maybe` by a diagnostic item the shape crate
# registers only under `quenchant_compiler_policy`, which must reach every
# crate in the graph, hence the encoded rustflags rather than Dylint's own
# cfg. Incremental compilation is off because the driver reads whole-crate
# HIR. A toolchain bump invalidates the driver: `rm -rf ~/.dylint_drivers
# target/dylint` before the wall runs again. The module documentation shape
# (`rustdoc_shape`) is denied for the whole workspace; a crate whose
# documentation predates it allows each refusing lint on its root, its count
# in the comment beside the allow. `doc_history_prose` is a report, forced to
# `warn` so the workspace's denied warnings never make it a refusal.
["check:dylint"]
description = "quenchant's policy library over the workspace"
env.CARGO_INCREMENTAL = "0"
env.DYLINT_RUSTFLAGS = "-D spec_attribute_present -D adequacy_present -D maybe_shape -D erased_error_signature -D spec_attribute_unqualified -D rustdoc_shape --force-warn doc_history_prose"
# Every policy run also records what each specification names, one file per
# compilation unit, for `evidence:obligations`. Recording always keeps one
# configuration, so the lint state and the records never disagree. The
# directory sits beside the rustdoc JSON the obligations report joins it with.
env.DYLINT_TOML = '''
[quenchant-dylints]
evidence_directory = "{{ config_root }}/target/evidence/records"
'''
# The plugin links through dylint-link, which renames the artifact with the
# toolchain suffix Dylint loads by; Cargo's linker variable is per target.
env.CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "dylint-link"
env.CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER = "dylint-link"
env.CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER = "dylint-link"
env.CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER = "dylint-link"
# The plugin builds separately, without this workspace's facade feature.
# Dylint reads source, so enforcement mode is irrelevant to its lints; the
# plugin's own specifications are checked by quenchant's gates. Keep this
# task plain, including when Cargo's encoded flags take precedence.
env.RUSTFLAGS = "{{ env.RUSTFLAGS | default(value='') | regex_replace(pattern='(^|\\\\s)--cfg(?:=|\\\\s+)anodized_(panic|print)\\\\b', rep='') | trim }}"
env.CARGO_ENCODED_RUSTFLAGS = "{% if env.CARGO_ENCODED_RUSTFLAGS is defined %}{% set flags = env.CARGO_ENCODED_RUSTFLAGS %}{% else %}{% set flags = env.RUSTFLAGS | default(value='') | trim | regex_replace(pattern='\\\\s+', rep='\u001f') %}{% endif %}{% set flags = flags | regex_replace(pattern='(^|\u001f)--cfg(?:=|\u001f)anodized_(panic|print)\\\\b', rep='') | trim_start(pat='\u001f') %}{{ flags }}{% if flags %}\u001f{% endif %}--cfg=quenchant_compiler_policy"
run = "cargo dylint --lib quenchant_dylints --no-deps -- --workspace --all-targets"

# External workflow consumers use one full revision in Dylint metadata for
# both the compiler plugin and this executable. Cargo's installation record
# tracks that revision; --locked uses the source repository's lockfile.
# A workspace-local install root prevents another consumer's install from
# replacing the executable between the dependency task and either gate.
["workflow:install"]
description = "Install the gate binary at the Dylint metadata revision"
tools.jq = "1.8.1"
run = '''
cargo install --git https://github.com/gandr-lang/quenchant --rev "$(cargo metadata --manifest-path Cargo.toml --no-deps --format-version 1 | jq -er '.metadata.dylint.libraries | map(select(.git == "https://github.com/gandr-lang/quenchant" and .pattern == "crates/quenchant-dylints")) | if length == 1 then .[0].rev | select(type == "string" and test("^[0-9a-f]{40}$")) else error("expected one pinned quenchant library") end')" --locked --bin quenchant-gates --root target/workflow-tools quenchant-gates
'''

["check:anodized"]
description = "Report the resolved specification state of the consumer workspace"
depends = ["workflow:install"]
env.PATH = "{{ config_root }}/target/workflow-tools/bin:{{ env.PATH }}"
run = "quenchant-gates anodized --manifest-path Cargo.toml"

# The facade selects enforcement from the annotated crate's cfg, so it is
# set for the whole graph. The enforcing tasks build into their own target
# directory: the wall runs its tasks in parallel, and a shared directory would
# rebuild artifacts under a sibling task's flags.
["check:anodized-enforcing"]
description = "Require specification enforcement in the enforcing configuration"
depends = ["workflow:install"]
env.PATH = "{{ config_root }}/target/workflow-tools/bin:{{ env.PATH }}"
env.RUSTFLAGS = "--cfg anodized_panic"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/enforcing"
run = "quenchant-gates anodized --manifest-path Cargo.toml --require-enforcing"

# Witness discovery lists the enforcing test inventory, the graph the
# enforcing test run has already built.
["check:witnesses"]
description = "Resolve adequacy witnesses in the consumer test inventory"
depends = ["workflow:install"]
env.PATH = "{{ config_root }}/target/workflow-tools/bin:{{ env.PATH }}"
env.RUSTFLAGS = "--cfg anodized_panic"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/enforcing"
run = "quenchant-gates witnesses --manifest-path Cargo.toml"

# Re-verification obligations (quenchant-gates obligations): a change owes a
# re-check by every specification that names a changed item, through an
# executable clause (the records `check:dylint` writes) or through an
# intra-doc link in a prose clause (rustdoc's JSON, resolved). One hop out: a
# specification whose own text is unchanged stops the cascade. CI runs these
# on a pull request; the merge queue still runs every test.
#
# Rustdoc builds in its own target directory so its JSON flags never rebuild
# `check:doc`'s HTML; default features match the policy pass's items.
["evidence:rustdoc"]
description = "Rustdoc JSON with every intra-doc link resolved, for the obligations report"
env.RUSTDOCFLAGS = "-Z unstable-options --output-format json"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/evidence"
run = "cargo doc --workspace --locked --no-deps --document-private-items"

# Lists the changed items against the base, the obligations they raise and the
# witnesses to rerun, and writes the pull-request comment (the witnesses) and
# the witness selection beside the records. The base defaults to where HEAD
# left origin/main, so work landed on main since is not read as this change.
# `--body` reads a pull-request body's ticked boxes and writes the body back
# with its `## Re-verification` section, one line per prose obligation; a tick
# holds while the clause and the items it names are unchanged. `--previous`
# reads the ticks from a file it leaves alone. `--require-acknowledged` exits 2
# while any prose obligation is unticked.
#
# A performance fix owes one more line: whether a lint could have refused the
# pattern it fixes. The body names the issues it works
# (`.config/claims/targets.jq`); when one of them, or the pull request named
# by `--pr`, carries `kind:performance` or `fix:performance`, the section
# gains a `lint assessment` box whose verdict reads `could: yes — <lint>,
# <reference>` or `could: no — <one sentence>`, open until ticked in one of
# those shapes. The labels are read through `gh` whenever a body is given.
["evidence:obligations"]
description = "List the specifications a change obliges to re-verify"
depends = ["check:dylint", "evidence:rustdoc", "workflow:install"]
tools.jq = "1.8.1"
usage = '''
arg "[base]" help="the revision the change is measured against; defaults to the merge base with origin/main"
flag "--previous <file>" help="a pull-request body whose acknowledgements carry over, left unchanged"
flag "--body <file>" help="a pull-request body whose acknowledgements carry over, rewritten with its re-verification section"
flag "--pr <number>" help="the pull request whose own labels join its targets' for the lint assessment"
flag "--require-acknowledged" help="exit 2 while any prose obligation is unticked"
'''
env.PATH = "{{ config_root }}/target/workflow-tools/bin:{{ env.PATH }}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
base=${usage_base:-$(git merge-base origin/main HEAD)}
extra=()
if [[ -n ${usage_previous:-} ]]; then extra+=(--previous "$usage_previous"); fi
if [[ -n ${usage_body:-} ]]; then extra+=(--body "$usage_body"); fi
if [[ ${usage_require_acknowledged:-false} == true ]]; then extra+=(--require-acknowledged); fi
text=${usage_body:-${usage_previous:-}}
if [[ -n $text ]]; then
  numbers=$(jq -Rrs -L .config/claims 'include "targets"; targets(working) | unique[]' "$text")
  if [[ -n ${usage_pr:-} ]]; then numbers+=$'\n'$usage_pr; fi
  labels=()
  for number in $numbers; do
    labels+=("$(gh api "repos/{owner}/{repo}/issues/$number" --jq '[.labels[].name] | join(",")')")
  done
  extra+=(--labels "$(IFS=,; printf '%s' "${labels[*]}")")
fi
quenchant-gates obligations --manifest-path Cargo.toml --base "$base" \
  --records target/evidence/records --rustdoc target/evidence/doc "${extra[@]}" \
  --comment target/evidence/comment.md --selection target/evidence/selection
'''

# The obligated witnesses, under the enforcing gate's flags and target
# directory so a restored enforcing build serves them. The selection names
# each witness's package, so Cargo builds only those packages' tests, with
# dependency features resolved as for the whole workspace: a narrower
# selection would change the features of shared dependencies and rebuild
# every crate above them. The selection is `-p` per package, then `-E` and one
# filterset whose alternatives join with ` | `. A change obligating thousands
# of witnesses makes that one argument longer than the kernel accepts (Linux
# refuses an argument over 128 KiB), so the alternatives run in batches of at
# most 64 KiB of filterset, each under every selected package. A failing batch
# fails the task once the rest have run; with more than one batch, each
# batch's JUnit report is kept beside the others as `junit-<n>.xml`.
["evidence:witnesses"]
description = "Rerun the obligated witnesses with specifications enforced"
env.RUSTFLAGS = "--cfg anodized_panic"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/enforcing"
env.CARGO_UNSTABLE_FEATURE_UNIFICATION = "true"
env.CARGO_RESOLVER_FEATURE_UNIFICATION = "workspace"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
mapfile -t selection < target/evidence/selection
if (( ${#selection[@]} == 0 )); then
  echo 'no obligated witness to rerun'
  exit 0
fi
profile=${NEXTEST_PROFILE:-default}
packages=("${selection[@]:0:${#selection[@]}-2}")
filterset=${selection[-1]}
mapfile -t alternatives <<< "${filterset// | /$'\n'}"
limit=65536
batches=()
batch=''
for alternative in "${alternatives[@]}"; do
  if [[ -n $batch ]] && (( ${#batch} + 3 + ${#alternative} > limit )); then
    batches+=("$batch")
    batch=''
  fi
  batch=${batch:+$batch | }$alternative
done
batches+=("$batch")
status=0
for index in "${!batches[@]}"; do
  cargo nextest run --locked --profile "$profile" "${packages[@]}" -E "${batches[index]}" || status=1
  report=target/nextest/$profile/junit.xml
  if (( ${#batches[@]} > 1 )) && [[ -f $report ]]; then
    mv "$report" "target/nextest/$profile/junit-$((index + 1)).xml"
  fi
done
exit "$status"
{% endraw %}'''

# `RUSTDOCFLAGS="-D warnings"` makes every rustdoc lint fatal, so a broken
# intra-doc link — the vocabulary tables are rustdoc the types link into — is a
# gate failure, not a warning. The clippy wall's `missing_docs_in_private_items`
# supplies the missing-docs half; this gate supplies the rustdoc-lint half.
["check:doc"]
description = "Private-item rustdoc with every rustdoc lint denied"
env.RUSTDOCFLAGS = "-D warnings"
run = "cargo doc --workspace --locked --no-deps --document-private-items"

["check:typos"]
description = "Spelling"
run = "typos"

# Documentation shape. `README.md` is a crate's only document: an overview
# linking into the crate's rustdoc, where mechanism, decisions and
# specification detail live. The first command refuses tracked markdown
# outside the allowlist, matched by Git's glob pathspec so `*` stays within
# one directory, which sizelint's patterns cannot express. `rubrics/**` holds
# the rubric set and the fixtures it is graded against. The second holds
# every tracked markdown file to its budget in `sizelint.toml`; treefmt's
# sizelint pass leaves markdown to this gate.
["check:markdown"]
description = "Tracked markdown on the README allowlist and within its budgets"
run = [
  '''
outside=$(git ls-files -- '*.md' \
  ':(exclude,glob)README.md' \
  ':(exclude,glob)CHANGELOG.md' \
  ':(exclude,glob)crates/README.md' \
  ':(exclude,glob)crates/*/README.md' \
  ':(exclude,glob)contrib/*/README.md' \
  ':(exclude,glob)rubrics/**')
if [ -n "$outside" ]; then
  printf '%s\n' "$outside" >&2
  echo 'markdown check FAILED: tracked markdown outside the README allowlist; move its prose into rustdoc' >&2
  exit 1
fi
echo 'markdown check OK: every tracked markdown file is on the README allowlist'
''',
  "git ls-files -z -- '*.md' | xargs -0 sizelint check",
]

# On macOS the suite runs in the pinned Linux CI image (`test`), where no
# application firewall sees its binaries. A native run on macOS, asked for by
# hand with `mise run test --native -- …`, meets the firewall: it keys its
# "allow incoming connections" decision on the code signature, and cargo's
# ad-hoc signature changes with every build, so an unsigned run prompts for
# each executable that binds a socket. When CODESIGN_IDENTITY names an
# identity in the login keychain, every executable cargo built is re-signed
# with it under one identifier before the run, so one allow covers every
# build. Both the `deps/` outputs and the uplifted binaries are signed: cargo
# copies a binary from `deps/` to `target/debug/<name>` on every invocation,
# so a signature on the copy alone is gone by the time a test spawns it.
# Unset, the executables run as built; CI and Linux never set it.
["check:tests"]
description = "Unit and integration tests over every target"
depends = ["test"]

# Reuse the build/sign/run path, with an isolated enforcing artifact graph.
["check:tests-enforcing"]
description = "Unit and integration tests with executable specifications enforced"
env.RUSTFLAGS = "--cfg anodized_panic"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/enforcing"
run = "mise run test -- --profile {{ env.NEXTEST_PROFILE | default(value='default') }}"

# CI separates compilation from execution so a failed test keeps the built
# state; `test` runs the same build first, which is then fresh.
["build:tests-enforcing"]
description = "Build and sign the enforcing test executables without running them"
env.RUSTFLAGS = "--cfg anodized_panic"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/enforcing"
run = "mise run build:tests"

# The edition-1-only peer binary is built apart from the workspace feature
# union and kept beside the default one; the tests find it through
# DOMHRINGR_EDITION_ONE.
["build:tests"]
description = "Build and sign the test executables, nextest arguments selecting them"
usage = 'arg "[args]" var=#true double_dash="optional"'
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
eval "args=(${usage_args:-})"
target=$(cargo metadata --manifest-path Cargo.toml --locked --no-deps --format-version 1 | jq -r '.target_directory')
cargo build --package domhringr-surface-peer --bin domhringr-peer --no-default-features --locked
cp "$target/debug/domhringr-peer" "$target/debug/domhringr-peer-edition-one"
# macOS ships bash 3.2, where an empty "${args[@]}" is unbound under set -u.
cargo nextest run --workspace --locked --no-run ${args[@]+"${args[@]}"}
if [[ -n "${CODESIGN_IDENTITY:-}" && "$(uname -s)" == "Darwin" ]]; then
  find "$target/debug" "$target/debug/deps" -maxdepth 1 -type f -perm -u+x ! -name '*.*' \
    -exec codesign --force --sign "$CODESIGN_IDENTITY" --identifier org.gandr-lang.domhringr.test {} +
elif [[ "$(uname -s)" == "Darwin" ]]; then
  echo "test: CODESIGN_IDENTITY is unset; skipping code signing. Firewall prompts may recur; see check:tests in .config/mise/tasks/mise-tasks-check.toml." >&2
fi
'''

# On a macOS workstation the suite runs in the pinned Linux CI image
# (`.config/mise/linux-tests`): no firewall keys on a binary inside the
# container, so no dialogue stalls an unattended run. `--native` runs it on
# the host instead, signed as `build:tests` describes. CI's macOS lane (`CI`
# set) and every other host run it natively.
[test]
description = "Build, sign, and run tests with nextest arguments"
usage = '''
flag "--native" help="on macOS, run on the host, signed, instead of in the Linux image"
arg "[args]" var=#true double_dash="required"
'''
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
eval "args=(${usage_args:-})"
if [[ "$(uname -s)" == Darwin && -z ${CI:-} && ${usage_native:-false} != true ]]; then
  exec .config/mise/linux-tests test ${args[@]+"${args[@]}"}
fi
mise run build:tests -- ${args[@]+"${args[@]}"}
target=$(cargo metadata --manifest-path Cargo.toml --locked --no-deps --format-version 1 | jq -r '.target_directory')
export DOMHRINGR_EDITION_ONE="$target/debug/domhringr-peer-edition-one"
cargo nextest run --workspace --locked ${args[@]+"${args[@]}"}
'''

# Git writes conflict markers as EXACTLY seven marker characters followed by
# end-of-line or whitespace plus a label (`<<<<<<< HEAD`, bare `=======`).
# Anchoring on `([[:space:]]|$)` keeps real markers matched while rejecting
# longer decorative runs -- setext underlines and `====` delimiter rules are
# not conflicts. The `:/` pathspec scopes the scan to tracked files under the
# repository root whatever directory the hook runs from.
["check:conflict-markers"]
description = "Detect unresolved Git conflict markers in tracked files"
run = """
if git grep -nIE '^(<<<<<<<|=======|>>>>>>>|\\|\\|\\|\\|\\|\\|\\|)([[:space:]]|$)' -- ':/'; then
  echo 'conflict marker check FAILED: unresolved Git conflict markers found' >&2
  exit 1
fi
echo 'conflict marker check OK: no conflict markers in tracked files'
"""

# Workflow tools are build-time policy, never package dependencies. Check
# Cargo's resolved metadata, including renamed and transitive dependencies,
# so a future publishable package cannot acquire an unpublished tool edge.
["check:publish"]
description = "Keep unpublished workflow tools outside the Cargo package graph"
tools.jq = "1.8.1"
run = '''
cargo metadata --manifest-path Cargo.toml --locked --format-version 1 | jq -se 'length == 1 and (.[0] | (.workspace_members | length > 0) and (.packages | length > 0) and all(.packages[]; (.name | test("^quenchant-(dylints|gates)$") | not) and all(.dependencies[]; .name | test("^quenchant-(dylints|gates)$") | not)))'
'''

["check:hooks"]
description = "Validate the declared hook floor"
run = "prek validate-config prek.toml"

# A sibling at another revision than the pin resolves another dependency
# graph than CI does: Cargo.lock drifts and the --locked gates refuse it with
# a lockfile error that names neither cause nor remedy.
["check:sibling"]
description = "vendor/gandr stands at the revision [workspace.metadata.siblings] pins"
run = '''
#!/usr/bin/env bash
set -euo pipefail
rev=$(sed -n '/^\[workspace\.metadata\.siblings\]$/,/^\[/s/^gandr = "\([0-9a-f]*\)"$/\1/p' Cargo.toml)
test -n "$rev"
head=$(git -C vendor/gandr rev-parse HEAD)
if [[ $head != "$rev" ]]; then
  echo "check:sibling: vendor/gandr is at $head, the pin is $rev; run mise run sibling:sync, or move the pin in the change that needs the newer gandr" >&2
  exit 1
fi
'''

# The rubric verdict and the record fold written in gandr: `domhringr/` holds
# gandr sources whose `runs` exemplars state the values the Rust crates give.
# The driver is built from the sibling at the pin, release-profiled (gandr's
# release profile builds faster than its debug one), in a target directory of
# its own so the wall's parallel tasks never share a lock or flags with it.
# `gandr check` settles every declaration, running each exemplar and comparing
# its value; `gandr fmt --check` holds each source to the layout the formatter
# writes.
["check:gandr"]
description = "The gandr sources under domhringr/, checked, run and formatted by the sibling's driver"
dir = "{{config_root}}/vendor/gandr"
env.CARGO_TARGET_DIR = "{{config_root}}/target/gandr"
env.RUSTFLAGS = ""
run = [
  "cargo build --quiet --locked --release --package gandr-lang --bin gandr",
  "{{config_root}}/target/gandr/release/gandr check {{config_root}}/domhringr",
  "{{config_root}}/target/gandr/release/gandr fmt --check {{config_root}}/domhringr",
]

["check:format"]
description = "Shared formatter and configuration wall"
run = "treefmt --ci"

# npm sidecars and mise.lock move together; a warm install can hide a digest
# mismatch that fails cold CI bootstrap. --locked refuses that mismatch.
# Name the npm pins so a workstation does not install unrelated global tools.
["check:lockfile"]
description = "Check npm-backed pins install from the committed lockfile"
run = "mise install --locked npm:oxfmt npm:@commitlint/cli"

# The enforcing suite, instrumented into target/coverage so it never shares
# the cached enforcing state. The edition-1 peer is the binary the suite
# spawns; it is not part of the instrumented graph. On a macOS workstation it
# runs in the Linux image, as `test` does, so the target directory is the one
# the caller selected, never the tree's own.
["check:coverage"]
description = "Enforcing line coverage of the workspace, as coverage.lcov"
run = '''
#!/usr/bin/env bash
set -euo pipefail
root="{{ config_root }}"
if [[ "$(uname -s)" == Darwin && -z ${CI:-} ]]; then
  exec .config/mise/linux-tests check:coverage
fi
target=${CARGO_TARGET_DIR:-$root/target}
export NEXTEST_PROFILE=ci-enforcing
CARGO_TARGET_DIR=$target cargo build --package domhringr-surface-peer --bin domhringr-peer --no-default-features --locked
cp "$target/debug/domhringr-peer" "$target/debug/domhringr-peer-edition-one"
export DOMHRINGR_EDITION_ONE="$target/debug/domhringr-peer-edition-one"
RUSTFLAGS="--cfg anodized_panic" CARGO_TARGET_DIR="$target/coverage" \
  cargo llvm-cov nextest --workspace --locked --lcov --output-path "$root/coverage.lcov"
# An instrumented binary run with its profile path cleared writes its
# profile into its working directory, out of the report; none may remain.
stray=$(git -C "$root" ls-files --others --exclude-standard -- '*.profraw')
if [[ -n $stray ]]; then
  printf 'check:coverage: profiles written outside target/:\n%s\n' "$stray" >&2
  exit 1
fi
'''

# The stacking rule's readings (gandr-lang/gandr#1264): `chain.jq` reads a
# pull request's stack from the open pull requests, `top.jq` the top a new one
# stacks on, and `decide.jq` how `pr:land` lands. Each case in
# `.config/pr-stack/cases.json` names its program, its arguments and input,
# and the output it must give; `decide.jq`'s output is its raw line, the
# others' compact JSON.
["check:pr-stack"]
description = "The stacking rule's readings give each recorded case its output"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
failed=0
while IFS= read -r case; do
  name=$(jq -r .name <<< "$case")
  program=$(jq -r .program <<< "$case")
  mapfile -t args < <(jq -r '(.args // {}) | to_entries[] | "--argjson", .key, (.value | tojson)' <<< "$case")
  mode=-c
  if [[ "$program" == decide.jq ]]; then mode=-r; fi
  got=$(jq .input <<< "$case" | jq "$mode" "${args[@]}" -f ".config/pr-stack/$program")
  want=$(jq -r .output <<< "$case")
  if [[ "$got" != "$want" ]]; then
    printf 'pr-stack case FAILED (%s): %s\n  gave:   %s\n  wanted: %s\n' "$program" "$name" "$got" "$want" >&2
    failed=1
  fi
done < <(jq -c '.[]' .config/pr-stack/cases.json)
(( failed == 0 )) || exit 1
echo "pr-stack check OK: $(jq length .config/pr-stack/cases.json) cases read as recorded"
'''

# The claim lifecycle (`.config/claims/decide.jq`, gandr-lang/gandr#1270)
# picks the claims that come off. Each case in `.config/claims/cases.json`
# holds an input and the removals it must give: a merge's `Advances` and
# closing targets, the closed, tracking and epic sweep, 24 hours of silence,
# and an open pull request that keeps a claim.
["check:claims"]
description = "The claim lifecycle gives each recorded case its removals"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
failed=0
while IFS= read -r case; do
  name=$(jq -r .name <<< "$case")
  got=$(jq .input <<< "$case" | jq -r -L .config/claims -f .config/claims/decide.jq)
  want=$(jq -r .output <<< "$case")
  if [[ "$got" != "$want" ]]; then
    printf 'claims case FAILED: %s\n  gave:\n%s\n  wanted:\n%s\n' "$name" "$got" "$want" >&2
    failed=1
  fi
done < <(jq -c '.[]' .config/claims/cases.json)
(( failed == 0 )) || exit 1
echo "claims check OK: $(jq length .config/claims/cases.json) cases gave their removals"
'''
