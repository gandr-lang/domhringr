[package]
name = "domhringr-surface-peer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The domhringr peer binary: opens, grants on, notes to, binds paths in, claims DNS names for, introduces by label, resolves anchors of, views, reads and syncs a sedimentree over iroh, and checks a concepts tree for drift"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["domhringr", "iroh", "peer", "sedimentree", "sync"]
categories = ["command-line-utilities", "network-programming"]
publish.workspace = true

[[bin]]
name = "domhringr-peer"
path = "src/main.rs"

[dependencies]
domhringr-record-tree = { workspace = true }
lexopt = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
