[package]
name = "domhringr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The domhringr operator's binary: lists a project's seats and tasks, dispatches a seat to a task, and verifies, decides and lands the change it reports, reading the report as evidence fetched from its seat"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["agents", "domhringr", "factory", "toolchain"]
categories = ["command-line-utilities", "development-tools"]
# The one published crate of this workspace: the name is claimed at 0.0.0.
publish = true

[[bin]]
name = "domhringr"
path = "src/main.rs"

[dependencies]
domhringr-judge-oracle = { workspace = true }
domhringr-record-evidence = { workspace = true }
domhringr-record-tree = { workspace = true }
domhringr-seat-slot = { workspace = true }
domhringr-strategy-document = { workspace = true }
gandr-storage-values = { workspace = true }
lexopt = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
